# Rebuilds index.json whenever books are added, changed or removed, so the app shows them.
name: Build index

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-index.mjs
      - name: Commit index.json if it changed
        run: |
          if git diff --quiet -- index.json && git ls-files --error-unmatch index.json >/dev/null 2>&1; then
            echo "index.json is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Update index.json"
          git push
