<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Human digestive system</title>
<link rel="stylesheet" href="player.css">
<style>
  .canal { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .torso { fill: var(--body); stroke: var(--line); stroke-width: 2; }
  .bolus { fill: var(--food); stroke: #5D4037; stroke-width: 1.5; }
</style>
</head>
<body>
<!-- Padhaku Animated Science · Class 10 Science, Chapter 5 Life Processes (Nutrition in human beings). Our own drawing. -->
<svg id="scene" viewBox="0 0 360 470" xmlns="http://www.w3.org/2000/svg">
  <!-- Body outline (not dimmed) -->
  <ellipse class="torso" cx="180" cy="52" rx="44" ry="48"/>
  <path class="torso" d="M150 96 L210 96 L214 112 Q298 120 300 182 L292 432 Q180 456 68 432 L60 182 Q62 120 146 112 Z"/>

  <!-- Mouth, teeth, tongue, salivary glands -->
  <g id="mouth" class="part">
    <path d="M160 70 Q180 86 200 70 Q180 80 160 70 Z" fill="#B71C1C"/>
    <path d="M163 71 L197 71" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="3 2"/>
    <ellipse cx="180" cy="77" rx="10" ry="3.5" fill="#EF9A9A"/>
  </g>
  <g id="salivary" class="part">
    <ellipse cx="146" cy="80" rx="9" ry="6" fill="#CE93D8"/>
    <ellipse cx="214" cy="80" rx="9" ry="6" fill="#CE93D8"/>
  </g>

  <!-- Large intestine under the small intestine -->
  <path id="large" class="part canal" stroke="#E7A390" stroke-width="17"
        d="M172 382 Q122 394 94 382 L91 282 Q91 270 105 270 L255 270 Q269 270 269 284 L269 382 Q267 398 240 402 L194 406 L184 428"/>
  <!-- Oesophagus -->
  <path id="oesophagus" class="part canal" stroke="var(--organ)" stroke-width="11" d="M180 80 L180 150 Q181 168 204 176"/>
  <!-- Liver and gall bladder -->
  <g id="liver" class="part">
    <path d="M92 172 Q148 150 202 166 Q192 206 150 212 Q102 214 92 172 Z" fill="#A6574B"/>
    <ellipse cx="152" cy="214" rx="8" ry="6" fill="#8BC34A"/>
  </g>
  <!-- Stomach -->
  <path id="stomach" class="part" fill="var(--organ2)" stroke="#B71C1C" stroke-width="1.5"
        d="M200 166 Q252 150 264 192 Q270 238 226 247 Q196 250 188 234 Q206 230 215 214 Q221 196 201 186 Z"/>
  <!-- Pancreas -->
  <path id="pancreas" class="part" fill="#F6C177" d="M160 252 Q206 241 252 254 Q252 263 210 263 Q174 265 160 259 Z"/>
  <!-- Small intestine -->
  <path id="small" class="part canal" stroke="var(--organ)" stroke-width="11"
        d="M192 244 C150 258 132 280 160 290 S238 300 210 315 S132 326 150 341 S238 351 206 366 S152 376 172 382"/>

  <!-- Juices (shown only in step 4) -->
  <g id="juices" class="only">
    <path id="p-bile" d="M152 218 Q160 238 190 246" fill="none" stroke="#8BC34A" stroke-width="2" stroke-dasharray="3 3"/>
    <path id="p-panc" d="M206 256 Q200 250 194 246" fill="none" stroke="#F6A623" stroke-width="2" stroke-dasharray="3 3"/>
    <g id="bile-drops"><circle transform="translate(-40,-40)" r="3.5" fill="#7CB342"/><circle transform="translate(-40,-40)" r="3.5" fill="#7CB342"/><circle transform="translate(-40,-40)" r="3.5" fill="#7CB342"/></g>
    <g id="panc-drops"><circle transform="translate(-40,-40)" r="3.5" fill="#F6A623"/><circle transform="translate(-40,-40)" r="3.5" fill="#F6A623"/></g>
  </g>
  <!-- Gastric juice bubbles (step 3) -->
  <g id="gastric" class="only">
    <circle cx="232" cy="190" r="3" fill="#FFF59D"/><circle cx="246" cy="214" r="3" fill="#FFF59D"/>
    <circle cx="224" cy="230" r="3" fill="#FFF59D"/><circle cx="214" cy="180" r="3" fill="#FFF59D"/>
  </g>

  <!-- Villi, zoomed (step 6) -->
  <g id="villi" class="only">
    <circle cx="292" cy="118" r="56" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
    <line x1="246" y1="150" x2="214" y2="318" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M246 150 L246 128 Q246 112 256 112 Q266 112 266 128 L266 150 L276 150 L276 122 Q276 104 287 104 Q298 104 298 122 L298 150 L308 150 L308 128 Q308 112 318 112 Q328 112 328 128 L328 150 Z"
          fill="#F8BBD0" stroke="#C2185B" stroke-width="1.2"/>
    <path d="M256 150 L256 124 M287 150 L287 114 M318 150 L318 124" stroke="#E53935" stroke-width="2.2"/>
    <path d="M260 150 L260 126 M291 150 L291 116 M322 150 L322 126" stroke="#3949AB" stroke-width="2.2"/>
    <g id="absorb"><circle transform="translate(-40,-40)" r="2.6" fill="var(--food)"/><circle transform="translate(-40,-40)" r="2.6" fill="var(--food)"/><circle transform="translate(-40,-40)" r="2.6" fill="var(--food)"/></g>
    <path id="p-absorb" d="M287 92 L287 140" fill="none"/>
    <text x="292" y="168" text-anchor="middle" class="lbl" id="l-villi" data-hi="दीर्घरोम">Villi</text>
  </g>

  <!-- Food bolus -->
  <circle id="bolus" class="bolus" r="7" cx="0" cy="0"/>

  <!-- Paths the food follows (invisible) -->
  <path id="p-oes" d="M180 82 L180 150 Q181 168 204 176" fill="none"/>
  <path id="p-sto" d="M206 186 Q236 170 250 196 Q256 228 224 236 Q200 236 196 240" fill="none"/>
  <path id="p-small" d="M192 244 C150 258 132 280 160 290 S238 300 210 315 S132 326 150 341 S238 351 206 366 S152 376 172 382" fill="none"/>
  <path id="p-large" d="M172 382 Q122 394 94 382 L91 282 Q91 270 105 270 L255 270 Q269 270 269 284 L269 382 Q267 398 240 402 L194 406 L184 432" fill="none"/>

  <!-- Labels -->
  <line id="l-mouth-line" class="lead" x1="160" y1="74" x2="92" y2="40"/>
  <text id="l-mouth" class="lbl" x="18" y="36" data-hi="मुख">Mouth</text>
  <line id="l-salivary-line" class="lead" x1="214" y1="82" x2="262" y2="40"/>
  <text id="l-salivary" class="lbl" x="232" y="34" data-hi="लाला ग्रंथि">Salivary gland</text>
  <line id="l-oes-line" class="lead" x1="182" y1="128" x2="250" y2="128"/>
  <text id="l-oes" class="lbl" x="254" y="132" data-hi="ग्रसिका">Oesophagus</text>
  <line id="l-stomach-line" class="lead" x1="260" y1="210" x2="306" y2="210"/>
  <text id="l-stomach" class="lbl" x="276" y="226" data-hi="आमाशय">Stomach</text>
  <line id="l-liver-line" class="lead" x1="110" y1="180" x2="40" y2="160"/>
  <text id="l-liver" class="lbl" x="10" y="154" data-hi="यकृत">Liver</text>
  <line id="l-gall-line" class="lead" x1="146" y1="218" x2="56" y2="226"/>
  <text id="l-gall" class="lbl" x="6" y="244" data-hi="पित्ताशय">Gall bladder</text>
  <line id="l-pancreas-line" class="lead" x1="244" y1="258" x2="300" y2="258"/>
  <text id="l-pancreas" class="lbl" x="266" y="252" data-hi="अग्न्याशय">Pancreas</text>
  <line id="l-small-line" class="lead" x1="200" y1="330" x2="300" y2="330"/>
  <text id="l-small" class="lbl" x="258" y="348" data-hi="क्षुद्रांत्र">Small intestine</text>
  <line id="l-large-line" class="lead" x1="93" y1="330" x2="40" y2="330"/>
  <text id="l-large" class="lbl" x="4" y="312" data-hi="बृहदांत्र">Large intestine</text>
  <line id="l-anus-line" class="lead" x1="184" y1="430" x2="230" y2="450"/>
  <text id="l-anus" class="lbl" x="234" y="456" data-hi="गुदा">Anus</text>
</svg>
<script src="player.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const bolus = $('bolus');
  const P = Padhaku;
  P.animation({
    stepSeconds: 8,
    steps: [
      {
        name: { en: 'Mouth', hi: 'मुख' },
        text: { en: 'Teeth crush the food. Salivary glands pour saliva; its enzyme salivary amylase breaks down starch into simple sugar. The muscular tongue mixes the food with saliva.',
                hi: 'दाँत भोजन को पीसते हैं। लाला ग्रंथियाँ लालारस (लार) छोड़ती हैं; इसका एंजाइम लार एमिलेस मंड (स्टार्च) को सरल शर्करा में तोड़ता है। पेशीय जीभ भोजन को लार के साथ मिलाती है।' },
        focus: ['mouth', 'salivary'], labels: ['l-mouth', 'l-salivary'],
        tick: (p, t) => { bolus.setAttribute('transform', `translate(${180 + Math.sin(t * 9) * 4},${76 + Math.cos(t * 7) * 1.5})`); bolus.setAttribute('r', 5); },
      },
      {
        name: { en: 'Oesophagus (food pipe)', hi: 'ग्रसिका (भोजन नली)' },
        text: { en: 'The food pipe carries food to the stomach. Muscles in its lining contract rhythmically and push the food forward. These peristaltic movements occur all along the gut.',
                hi: 'ग्रसिका भोजन को आमाशय तक ले जाती है। इसके अस्तर की पेशियाँ लयबद्ध ढंग से सिकुड़कर भोजन को आगे धकेलती हैं। ये क्रमाकुंचन गतियाँ पूरी आहार नली में होती हैं।' },
        focus: ['oesophagus'], labels: ['l-oes'],
        tick: (p, t) => { bolus.setAttribute('r', 6); P.along(bolus, $('p-oes'), (t * 0.35) % 1); },
      },
      {
        name: { en: 'Stomach', hi: 'आमाशय' },
        text: { en: 'The stomach expands and its muscular walls mix the food with gastric juice. Gastric glands release hydrochloric acid (makes the medium acidic so pepsin can act), pepsin (digests proteins) and mucus (protects the stomach lining).',
                hi: 'आमाशय फैल जाता है और इसकी पेशीय भित्ति भोजन को जठर रस के साथ मिलाती है। जठर ग्रंथियाँ हाइड्रोक्लोरिक अम्ल (अम्लीय माध्यम बनाता है ताकि पेप्सिन काम करे), पेप्सिन (प्रोटीन पचाता है) और श्लेष्मा (आमाशय के अस्तर की रक्षा करता है) छोड़ती हैं।' },
        focus: ['stomach'], labels: ['l-stomach'], only: ['gastric'],
        tick: (p, t) => { bolus.setAttribute('r', 7); P.along(bolus, $('p-sto'), 0.15 + 0.6 * ((Math.sin(t * 1.4) + 1) / 2)); P.pulse($('stomach'), t, 0.98, 1.03, 1.6); },
      },
      {
        name: { en: 'Liver and pancreas', hi: 'यकृत और अग्न्याशय' },
        text: { en: 'A sphincter muscle lets food into the small intestine little by little. Bile juice from the liver makes it alkaline and its bile salts break fats into small globules. Pancreatic juice brings trypsin (proteins) and lipase (emulsified fats).',
                hi: 'एक अवरोधिनी पेशी भोजन को थोड़ा-थोड़ा करके क्षुद्रांत्र में भेजती है। यकृत से आया पित्तरस भोजन को क्षारीय बनाता है और पित्त लवण वसा की बड़ी गोलिकाओं को छोटी गोलिकाओं में तोड़ते हैं (इमल्सीकरण)। अग्न्याशयिक रस में ट्रिप्सिन (प्रोटीन) और लाइपेज (इमल्सीकृत वसा) होते हैं।' },
        focus: ['liver', 'pancreas', 'small'], labels: ['l-liver', 'l-gall', 'l-pancreas'], only: ['juices'],
        tick: (p, t) => { P.along(bolus, $('p-small'), 0.02); P.flow($('bile-drops'), $('p-bile'), t, 0.45); P.flow($('panc-drops'), $('p-panc'), t, 0.6); $('stomach').style.transform = ''; },
      },
      {
        name: { en: 'Small intestine', hi: 'क्षुद्रांत्र (छोटी आँत)' },
        text: { en: 'The longest part of the canal, coiled to fit. Here digestion is completed: intestinal juice turns proteins into amino acids, complex carbohydrates into glucose, and fats into fatty acids and glycerol.',
                hi: 'आहार नली का सबसे लंबा भाग, जो कुंडलित होकर कम जगह में समा जाता है। यहाँ पाचन पूरा होता है: आंत्र रस प्रोटीन को अमीनो अम्ल में, जटिल कार्बोहाइड्रेट को ग्लूकोज़ में और वसा को वसा अम्ल तथा ग्लिसरॉल में बदल देता है।' },
        focus: ['small'], labels: ['l-small'],
        tick: (p, t) => { bolus.setAttribute('r', 7 - 3 * p); P.along(bolus, $('p-small'), p); },
      },
      {
        name: { en: 'Villi absorb the food', hi: 'दीर्घरोम द्वारा अवशोषण' },
        text: { en: 'The inner lining of the small intestine has millions of finger-like villi. They increase the surface area, and their many blood vessels take the digested food to every cell of the body.',
                hi: 'क्षुद्रांत्र के आंतरिक अस्तर पर अनेक अंगुली जैसे उभार होते हैं, जिन्हें दीर्घरोम कहते हैं। ये अवशोषण का सतही क्षेत्रफल बढ़ाते हैं, और इनमें स्थित रुधिर वाहिकाएँ पचा हुआ भोजन शरीर की हर कोशिका तक पहुँचाती हैं।' },
        focus: ['small'], labels: ['l-villi'], only: ['villi'],
        tick: (p, t) => { bolus.setAttribute('r', 3); P.along(bolus, $('p-small'), 0.75); P.flow($('absorb'), $('p-absorb'), t, 0.5); },
      },
      {
        name: { en: 'Large intestine', hi: 'बृहदांत्र (बड़ी आँत)' },
        text: { en: 'Unabsorbed food goes to the large intestine, where more villi absorb water. The rest leaves the body through the anus; its exit is controlled by the anal sphincter.',
                hi: 'बिना पचा भोजन बृहदांत्र में भेज दिया जाता है, जहाँ और दीर्घरोम जल का अवशोषण करते हैं। शेष पदार्थ गुदा द्वारा शरीर से बाहर निकाला जाता है; इसका बहिर्क्षेपण गुदा अवरोधिनी द्वारा नियंत्रित होता है।' },
        focus: ['large'], labels: ['l-large', 'l-anus'],
        tick: (p, t) => { bolus.setAttribute('r', 5); P.along(bolus, $('p-large'), p); },
      },
      {
        name: { en: 'The whole journey', hi: 'पूरी यात्रा' },
        text: { en: 'Mouth → oesophagus → stomach → small intestine (with bile and pancreatic juice) → large intestine → anus. Tap ◀ to revise any step.',
                hi: 'मुख → ग्रसिका → आमाशय → क्षुद्रांत्र (पित्तरस और अग्न्याशयिक रस के साथ) → बृहदांत्र → गुदा। किसी भी चरण को दोहराने के लिए ◀ दबाएँ।' },
        focus: [], labels: 'all',
        tick: (p, t) => {
          const parts = [$('p-oes'), $('p-sto'), $('p-small'), $('p-large')];
          const k = (t * 0.12) % 1, seg = Math.min(3, Math.floor(k * 4));
          bolus.setAttribute('r', 6); P.along(bolus, parts[seg], k * 4 - seg);
        },
      },
    ],
  });
</script>
</body>
</html>
