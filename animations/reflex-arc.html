<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Reflex arc</title>
<link rel="stylesheet" href="player.css">
<style>
  .skin { fill: #F5C6A5; stroke: #C68A63; stroke-width: 1.5; }
  .muscle { fill: #E57373; stroke: #B71C1C; stroke-width: 1.5; }
  .nerve { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .sens { stroke: #42A5F5; } .relay { stroke: #AB47BC; } .motor { stroke: #66BB6A; }
  .cord { fill: #ECEFF1; stroke: #90A4AE; stroke-width: 2; }
  .grey { fill: #B0BEC5; }
</style>
</head>
<body>
<!-- Padhaku Animated Science · Class 10 Science, Chapter 6 Control and Coordination (Reflex actions; neuron and synapse).
     Our own drawing. -->
<svg id="scene" viewBox="0 0 360 470" xmlns="http://www.w3.org/2000/svg">
  <!-- Candle -->
  <g id="flame" class="part">
    <rect x="44" y="330" width="22" height="60" rx="3" fill="#FFF8E1" stroke="#BCAAA4"/>
    <path id="fire" d="M55 330 Q42 312 55 290 Q68 312 55 330 Z" fill="#FFB300"/>
    <path d="M55 326 Q49 316 55 304 Q61 316 55 326 Z" fill="#FF7043"/>
  </g>
  <!-- Arm and hand (moves away in step 5) -->
  <g id="arm">
    <path class="skin" d="M300 236 Q250 230 200 252 L140 286 Q112 298 96 300 L84 304 Q74 308 78 316 Q84 322 98 318 L118 314 Q150 312 180 296 L240 268 Q290 262 312 270 Z"/>
    <path id="biceps" class="part muscle" d="M206 252 Q236 236 270 242 Q262 258 224 266 Z"/>
    <circle id="receptor" class="part" cx="86" cy="310" r="6" fill="#FFEB3B" stroke="#F57F17" stroke-width="2"/>
  </g>
  <!-- Spinal cord (cross-section) -->
  <g id="cord" class="part">
    <ellipse class="cord" cx="290" cy="120" rx="52" ry="40"/>
    <path class="grey" d="M290 98 Q262 84 256 100 Q262 116 278 120 Q262 124 256 140 Q262 156 290 142 Q318 156 324 140 Q318 124 302 120 Q318 116 324 100 Q318 84 290 98 Z"/>
  </g>
  <!-- Neurons -->
  <path id="sensory" class="part nerve sens" d="M86 310 Q120 240 180 190 Q230 150 262 104"/>
  <path id="relay" class="part nerve relay" d="M262 104 Q280 112 288 120 Q296 128 300 140"/>
  <path id="motor" class="part nerve motor" d="M300 140 Q300 200 280 230 Q260 246 240 250"/>
  <circle cx="200" cy="176" r="6" fill="#42A5F5"/>
  <!-- Brain (step 6) -->
  <g id="brain" class="only">
    <path d="M290 80 L290 30" class="nerve" stroke="#FFB300" stroke-dasharray="5 4"/>
    <path d="M290 26 l-7 12 h14 z" fill="#FFB300"/>
    <text x="300" y="44" class="lbl" id="l-brain" data-hi="मस्तिष्क तक">to brain</text>
  </g>

  <!-- Synapse, zoomed (step 7) -->
  <g id="synapse" class="only">
    <rect x="16" y="20" width="230" height="120" rx="18" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
    <path d="M30 80 L96 80" stroke="#42A5F5" stroke-width="10" stroke-linecap="round"/>
    <path d="M96 62 Q120 62 120 80 Q120 98 96 98 Z" fill="#42A5F5"/>
    <path d="M138 62 Q130 80 138 98 L200 98 Q214 80 200 62 Z" fill="#66BB6A"/>
    <path d="M200 80 L232 72 M200 80 L232 90" stroke="#66BB6A" stroke-width="4"/>
    <path id="p-chem" d="M118 80 L138 80" fill="none"/>
    <g id="chem"><circle transform="translate(-40,-40)" r="2.6" fill="#FFB300"/><circle transform="translate(-40,-40)" r="2.6" fill="#FFB300"/><circle transform="translate(-40,-40)" r="2.6" fill="#FFB300"/></g>
    <circle id="spark" r="6" fill="#FFEB3B" class="glow"/>
    <path id="p-imp" d="M30 80 L110 80" fill="none"/>
    <text x="30" y="40" class="lbl" id="l-axon" data-hi="तंत्रिकाक्ष का सिरा">Axon end</text>
    <text x="112" y="124" class="lbl" id="l-syn" data-hi="सिनेप्स">Synapse</text>
    <text x="150" y="40" class="lbl" id="l-dend" data-hi="अगली द्रुमिका">Next dendrite</text>
  </g>

  <!-- Impulse -->
  <circle id="impulse" r="7" fill="#FFEB3B" class="glow"/>

  <!-- Labels -->
  <text id="l-receptor" class="lbl" x="18" y="282" data-hi="ग्राही (त्वचा)">Receptor (skin)</text>
  <text id="l-sensory" class="lbl" x="92" y="226" data-hi="संवेदी तंत्रिका कोशिका">Sensory neuron</text>
  <text id="l-cord" class="lbl" x="226" y="186" data-hi="मेरुरज्जु">Spinal cord</text>
  <text id="l-relay" class="lbl" x="154" y="132" data-hi="प्रसारण तंत्रिका कोशिका">Relay neuron</text>
  <text id="l-motor" class="lbl" x="226" y="216" data-hi="प्रेरक तंत्रिका कोशिका">Motor neuron</text>
  <text id="l-effector" class="lbl" x="196" y="300" data-hi="प्रभावक (पेशी)">Effector (muscle)</text>
  <text id="l-flame" class="lbl" x="22" y="410" data-hi="गर्म वस्तु">Hot object</text>
</svg>
<script src="player.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const P = Padhaku;
  const imp = $('impulse');
  const hide = () => imp.setAttribute('transform', 'translate(-50,-50)');
  const arm = (x) => { $('arm').style.transform = `translate(${x}px, ${-x * 0.4}px)`; };
  const flicker = (t) => { $('fire').style.transformBox = 'fill-box'; $('fire').style.transformOrigin = '50% 100%'; $('fire').style.transform = `scaleY(${1 + Math.sin(t * 13) * 0.08})`; };
  P.animation({
    stepSeconds: 7,
    steps: [
      {
        name: { en: 'Touching something hot', hi: 'गर्म वस्तु को छूना' },
        text: { en: 'Suppose your finger touches a flame. Receptors in the skin detect the heat and start an electrical impulse at once.',
                hi: 'मान लीजिए आपकी उँगली लौ को छू जाती है। त्वचा में स्थित ग्राही ऊष्मा को पहचानते हैं और तुरंत एक विद्युत आवेग शुरू कर देते हैं।' },
        focus: ['flame', 'receptor'], labels: ['l-receptor', 'l-flame'],
        tick: (p, t) => { arm(0); flicker(t); hide(); P.pulse($('receptor'), t, 1, 1.5, 0.6); },
      },
      {
        name: { en: 'Sensory neuron', hi: 'संवेदी तंत्रिका कोशिका' },
        text: { en: 'The sensory neuron carries the impulse from the receptor towards the spinal cord. Nerves from all over the body meet in a bundle in the spinal cord on their way to the brain.',
                hi: 'संवेदी तंत्रिका कोशिका आवेग को ग्राही से मेरुरज्जु की ओर ले जाती है। पूरे शरीर की तंत्रिकाएँ मस्तिष्क की ओर जाते हुए मेरुरज्जु में एक बंडल के रूप में मिलती हैं।' },
        focus: ['sensory', 'receptor', 'cord'], labels: ['l-sensory', 'l-cord'],
        tick: (p, t) => { arm(0); flicker(t); P.along(imp, $('sensory'), (t * 0.4) % 1); },
      },
      {
        name: { en: 'Relay neuron in the spinal cord', hi: 'मेरुरज्जु में प्रसारण तंत्रिका कोशिका' },
        text: { en: 'In the spinal cord a relay neuron connects the input (sensory) nerve straight to the output (motor) nerve. This short connection is the reflex arc – it is formed in the spinal cord itself.',
                hi: 'मेरुरज्जु में एक प्रसारण तंत्रिका कोशिका निवेश (संवेदी) तंत्रिका को सीधे निर्गम (प्रेरक) तंत्रिका से जोड़ देती है। यही छोटा जुड़ाव प्रतिवर्ती चाप है, जो मेरुरज्जु में ही बनता है।' },
        focus: ['relay', 'cord'], labels: ['l-relay', 'l-cord'],
        tick: (p, t) => { arm(0); flicker(t); P.along(imp, $('relay'), (t * 0.6) % 1); },
      },
      {
        name: { en: 'Motor neuron', hi: 'प्रेरक तंत्रिका कोशिका' },
        text: { en: 'The motor neuron carries the message from the spinal cord to the effector – here, the muscle of the arm.',
                hi: 'प्रेरक तंत्रिका कोशिका संदेश को मेरुरज्जु से प्रभावक तक ले जाती है – यहाँ भुजा की पेशी तक।' },
        focus: ['motor', 'biceps'], labels: ['l-motor', 'l-effector'],
        tick: (p, t) => { arm(0); flicker(t); P.along(imp, $('motor'), (t * 0.45) % 1); },
      },
      {
        name: { en: 'The hand is pulled back', hi: 'हाथ पीछे खिंच जाता है' },
        text: { en: 'The muscle contracts and the hand is pulled away from the flame – in a fraction of a second, without thinking. This quick, automatic response is a reflex action.',
                hi: 'पेशी सिकुड़ती है और हाथ लौ से दूर खिंच जाता है – पलक झपकते, बिना सोचे-समझे। यह तेज़, अपने आप होने वाली अनुक्रिया प्रतिवर्ती क्रिया है।' },
        focus: ['biceps', 'flame'], labels: ['l-effector'],
        tick: (p, t) => { flicker(t); hide(); arm(Math.min(1, p * 4) * 46); P.pulse($('biceps'), t, 1, 1.12, 0.7); },
      },
      {
        name: { en: 'The brain is told too', hi: 'मस्तिष्क को भी सूचना मिलती है' },
        text: { en: 'The information also goes on to reach the brain, so we feel the pain afterwards. Thinking takes longer, so reflex arcs are more efficient for quick responses.',
                hi: 'सूचना आगे मस्तिष्क तक भी पहुँचती है, इसलिए बाद में हमें दर्द महसूस होता है। सोचने में अधिक समय लगता है, इसलिए त्वरित अनुक्रिया के लिए प्रतिवर्ती चाप अधिक दक्ष हैं।' },
        focus: ['cord'], labels: ['l-brain', 'l-cord'], only: ['brain'],
        tick: (p, t) => { arm(46); flicker(t); P.along(imp, $('p-brainpath') || $('relay'), 0); imp.setAttribute('transform', `translate(290, ${80 - ((t * 30) % 50)})`); },
      },
      {
        name: { en: 'Across the synapse', hi: 'सिनेप्स के पार' },
        text: { en: 'Inside a neuron the impulse travels from the dendrite to the cell body and along the axon to its end. There, chemicals are released that cross the gap (synapse) and start a similar impulse in the dendrite of the next neuron.',
                hi: 'तंत्रिका कोशिका में आवेग द्रुमिका से कोशिकाकाय तक और फिर तंत्रिकाक्ष के साथ उसके सिरे तक जाता है। वहाँ कुछ रसायन निकलते हैं, जो रिक्त स्थान (सिनेप्स) को पार करके अगली तंत्रिका कोशिका की द्रुमिका में ऐसा ही आवेग शुरू करते हैं।' },
        focus: [], labels: ['l-axon', 'l-syn', 'l-dend'], only: ['synapse'],
        tick: (p, t) => { arm(46); hide(); P.along($('spark'), $('p-imp'), (t * 0.5) % 1); P.flow($('chem'), $('p-chem'), t, 0.6); },
      },
    ],
  });
</script>
</body>
</html>
